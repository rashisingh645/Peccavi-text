# configs/dipmark_baseline.yaml
# DiPMark baseline (Zhao et al., 2024) — n-gram context window hash, fixed delta.
# Uses last 5 tokens as partition seed (more robust than KGW's single-token hash).
# Run: python main.py --mode dipmark --config-file configs/dipmark_baseline.yaml \
#          --output results/dipmark_s7.json --seed 7

model:
  backbone: "meta-llama/Llama-2-7b-chat-hf"
  backend: "transformers"
  api_key: null
  load_in_4bit: true
  device: "auto"

watermarking:
  delta: 2.0
  gamma: 0.5
  window: 5
  secret_key: "PECCAVI-SECRET"
  watermark_mode: "dipmark"

agents:
  scriba_n_variants: 10

policy_learning:
  generations: 5
  n_eval_samples: 500

success_criteria:
  watermark_retention_pct: 51
  detection_auc_roc: 0.90
  human_readability_min: 3.0
